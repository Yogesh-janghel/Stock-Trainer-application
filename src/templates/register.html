{% extends 'base.html' %}

{% block title %}Register - Stock Trainer{% endblock %}

{% block content %}
<section class="masthead bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card p-4 p-md-5 shadow-lg border-0 mt-5">
                    <div class="card-body">
                        <div class="text-center mb-5">
                            <div class="bg-gradient-green d-inline-block p-3 rounded-circle mb-3 shadow">
                                <i class="fas fa-user-plus fa-2x text-white"></i>
                            </div>
                            <h2 class="text-uppercase font-weight-bold text-dark">Join the Market</h2>
                            <p class="text-muted">Start your risk-free trading journey today</p>
                        </div>
                        
                        {% if msg %}
                        <div class="alert alert-info border-0 rounded-pill text-center small mb-4">{{ msg }}</div>
                        {% endif %}

                        <form action="{{ url_for('register') }}" method="post">
                            <div class="row">
                                <div class="col-md-12 mb-4">
                                    <label class="small font-weight-bold text-secondary mb-1">Username</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0"><i class="fas fa-id-badge text-success"></i></span>
                                        <input class="form-control border-start-0 ps-0" id="username" name="username" type="text" placeholder="Choose a username" required />
                                    </div>
                                </div>
                                <div class="col-md-12 mb-4">
                                    <label class="small font-weight-bold text-secondary mb-1">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0"><i class="fas fa-envelope text-success"></i></span>
                                        <input class="form-control border-start-0 ps-0" id="email" name="email" type="email" placeholder="name@example.com" required />
                                    </div>
                                </div>
                                <div class="col-md-12 mb-4">
                                    <label class="small font-weight-bold text-secondary mb-1">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0"><i class="fas fa-shield-alt text-success"></i></span>
                                        <input class="form-control border-start-0 ps-0" id="password" name="password" type="password" placeholder="Create a strong password" required />
                                    </div>
                                </div>
                            </div>
                            <div class="d-grid mt-5">
                                <button class="btn btn-gradient btn-xl py-3" type="submit">Create Free Account</button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-5">
                            <p class="mb-0 text-muted small">Already a member? <a href="{{ url_for('login') }}" class="text-success font-weight-bold text-decoration-none">Log in here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
