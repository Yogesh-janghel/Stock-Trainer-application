{% extends 'base.html' %}

{% block title %}Login - Stock Trainer{% endblock %}

{% block content %}
<section class="masthead bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card p-4 p-md-5 shadow-lg border-0 mt-5">
                    <div class="card-body">
                        <div class="text-center mb-5">
                            <div class="bg-gradient-green d-inline-block p-3 rounded-circle mb-3 shadow">
                                <i class="fas fa-user-lock fa-2x text-white"></i>
                            </div>
                            <h2 class="text-uppercase font-weight-bold text-dark">Welcome Back</h2>
                            <p class="text-muted">Enter your credentials to access your account</p>
                        </div>
                        
                        {% if msg %}
                        <div class="alert alert-danger border-0 rounded-pill text-center small mb-4">{{ msg }}</div>
                        {% endif %}

                        <form action="{{ url_for('login') }}" method="post">
                            <div class="mb-4">
                                <label class="small font-weight-bold text-secondary mb-1">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-user text-success"></i></span>
                                    <input class="form-control border-start-0 ps-0" id="username" name="username" type="text" placeholder="Your username" required />
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="small font-weight-bold text-secondary mb-1">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-key text-success"></i></span>
                                    <input class="form-control border-start-0 ps-0" id="password" name="password" type="password" placeholder="********" required />
                                </div>
                            </div>
                            <div class="d-grid mt-5">
                                <button class="btn btn-gradient btn-xl py-3" type="submit">Sign In</button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-5">
                            <p class="mb-0 text-muted small">New to Stock Trainer? <a href="{{ url_for('register') }}" class="text-success font-weight-bold text-decoration-none">Create an account</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
