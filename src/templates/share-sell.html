{% extends 'base.html' %}

{% block title %}Sell {{ SS }} - Stock Trainer{% endblock %}

{% block content %}
<section class="masthead bg-primary text-white">
    <div class="container text-dark">
        <div class="row">
            <!-- Stock Info & Chart -->
            <div class="col-lg-8 mb-4">
                <div class="card p-4 h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="text-uppercase mb-0 text-secondary">{{ SS }}</h2>
                            <span class="badge bg-danger fs-5">Live Price: ₹{{ price }}</span>
                        </div>
                        <div class="chart-container" style="min-height: 400px;">
                            {{ plot|safe }}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sell Form -->
            <div class="col-lg-4 mb-4">
                <div class="card p-4 h-100">
                    <div class="card-body">
                        <h4 class="text-uppercase mb-4 text-secondary">Sale</h4>
                        
                        {% if msg %}
                        <div class="alert alert-info text-center">{{ msg }}</div>
                        {% endif %}

                        <form method="POST" action="{{ url_for('sellShare', stock_symbol=SS) }}">
                            <div class="mb-4 text-center">
                                <p class="text-muted mb-2">Available for Sale</p>
                                <h3 class="text-danger">{{ sa }} Shares</h3>
                            </div>
                            
                            <div class="form-floating mb-3">
                                <input type="number" class="form-control" id="SellQuant" name="SellQuant" placeholder="Quantity" min="1" required>
                                <label for="SellQuant">Quantity to Sell</label>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-danger btn-xl">Confirm Sale</button>
                            </div>
                        </form>
                        
                        <div class="mt-4 text-center">
                            <a href="{{ url_for('listSell') }}" class="text-secondary"><i class="fas fa-arrow-left me-1"></i> Back to Market</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
